spring:
  profiles:
    active: ${APP_PROFILE:local}
  application:
    name: sip-api

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/sip}
    username: ${DATASOURCE_USER:postgres}
    password: ${DATASOURCE_PASS:postgres}
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      poolName: SpringBootJPAHikariCP
      minimumIdle: 15
      maximumPoolSize: 50
      connectionTimeout: 30000
      idleTimeout: 30000
  jpa:
    hibernate:
      ddl-auto: update


security:
  token:
    jwt:
      expiration: ${SECURITY_JWT_EXPIRATION_EM_HORAS:8}
      secret: ${SECURITY_JWT_SECRET:1234567abcdeABCDE}

server:
  servlet:
    context-path: /sip/api

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
