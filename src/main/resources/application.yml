spring:
  application:
    name: sip-api
    baseUrl: localhost:8080

  datasource:
    url: jdbc:postgresql://localhost:5432/sip
    username: sip-root
    password: sip2025
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      email-verification:
        group-id: email-verification-sender
        topic: email-verification
        factory: emailVerificationKafkaListenerContainerFactory

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME:example@sip.com}
    password: ${EMAIL_PASSWORD:12345678}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    default-encoding: UTF-8
