<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Email Verification</title>
</head>
<body style="margin:0; padding:0; background-color:#f2f2f2;">
<table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="height:100vh; width:100%; text-align:center;">
    <tr>
        <td align="center" valign="middle">
            <table width="700" style="background-color: #ffffff; padding: 30px 20px 60px 20px; border-radius: 16px; font-family: Verdana, Geneva, Tahoma, sans-serif;">
            <tr>
                    <td align="center" style="padding-bottom: 30px;">
                        <img src="cid:sip-logo" alt="sip_logo" style="height: 128px; display: block;">
                    </td>
                </tr>
                <tr>
                    <td align="center">
                        <h2 style="color: #333333;">Olá, é o SIP!</h2>
                        <p style="font-size: 14px; color: #555; line-height: 1.5;">
                            Use o código ou clique no botão para verificar<br> o seu e-mail no nosso sistema:
                        </p>

                        <a th:href="@{${applicationLink}}"
                           style="display: inline-block; margin: 20px 0; padding: 12px 24px; background-color: #4CAF50; color: #ffffff; text-decoration: none; border-radius: 6px;">
                            Validar e-mail
                        </a>

                        <p style="font-size: 12px; color: #999999; line-height: 1.4;">
                            Caso não tenha sido redirecionado, copie a url abaixo e cole no seu navegador.
                        </p>
                        <h2 style="color: #777777; font-size: 12px;" th:text="${applicationLink}">-</h2>
                        <p style="font-size: 12px; color: #999999; line-height: 1.4;">
                            Se essa operação não foi feita por você,<br> ignore este e-mail.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
